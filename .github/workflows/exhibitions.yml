# Refreshes exhibitions.json every Monday, on demand from the Actions tab, and
# whenever the hand-kept list, the script or this file is pushed.
# The Yalla Nihao app reads it from raw.githubusercontent.com on this branch.
name: Update exhibitions

on:
  schedule:
    - cron: "0 3 * * 1"   # Monday 03:00 UTC = 06:00 Baghdad
  workflow_dispatch:
  # Also right after the hand-kept list, the script or this file changes.
  push:
    branches: [main]
    paths:
      - exhibitions-manual.json
      - scripts/update_exhibitions.py
      - .github/workflows/exhibitions.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the venue schedules
        run: python3 scripts/update_exhibitions.py
      - name: Commit if anything changed
        run: |
          if git diff --quiet -- exhibitions.json; then
            echo "No change."
            exit 0
          fi
          git config user.name "exhibitions-bot"
          git config user.email "actions@users.noreply.github.com"
          git add exhibitions.json
          git commit -m "Update exhibitions"
          git push
